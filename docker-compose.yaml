services:
  minion:
    build: .
    image: ghcr.io/bob-ros2/bob-minion:latest
    container_name: minion
    restart: unless-stopped
    volumes:
      # Mount the host's project directory (where minion.py lives) to /app,
      # overriding the image's copy — so code edits by the agent persist.
      - .:/app
      # Mount minion.py explicitly as read-only to prevent the agent from self-mutating its core
      - ./minion.py:/app/minion.py:ro
      # Mount ~/.minion/ directly (bind mount) so the agent's sessions,
      # skills, evolve data, and limbus live on the host filesystem.
      - ~/.minion:/home/minion/.minion
    environment:
      # --- User permissions (PUID=0 for root, default: 1000 for minion user) ---
      PUID: 1000
      PGID: 1000
      # --- Model endpoint (override in .env or shell) ---
      # Your self-hosted OpenAI-compatible API (llama.cpp, vLLM, SGLang, …)
      MINION_BASE_URL: "http://192.168.1.9:8022/v1"
      MINION_MODEL: ""
      MINION_API_KEY: "sk-noop"
      # --- Agent behaviour & generation limits ---
      MINION_APPROVAL: "yolo"
      MINION_HOME: "/home/minion/.minion"
      MINION_MAX_TOKENS: 3000
      MINION_REASONING_ONLY_CHARS: 12000
      # MINION_TEMPERATURE: "0.2"
      # MINION_FREQUENCY_PENALTY: "0.3"
      # --- Evolution environment ---
      EVOLVE_DIR: "/home/minion/.minion/evolve"
      EVOLVE_RESULT_FILE: "/home/minion/.minion/evolve/result.txt"
      EVOLVE_PROMPT_FILE: "/home/minion/.minion/evolve/prompt.txt"
      EVOLVE_LOCK_FILE: "/home/minion/.minion/evolve/lock"
      LIMBUS_FILE: "/home/minion/.minion/evolve/limbus.md"
      # The workspace is /app — the agent edits its own codebase there
      WORKSPACE: "/app"
      # Cron schedule — every N minutes. Use */30 for production.
      CRON_SCHEDULE: "*/3 * * * *"
    working_dir: /app

